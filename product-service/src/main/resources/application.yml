server:
  port: 8082

eureka:
  instance:
    hostname: localhost

spring:
  application:
    name: product-service
  cloud:
    eureka:
      client:
        service-url:
          defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
      instance:
        prefer-ip-address: true
        hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
