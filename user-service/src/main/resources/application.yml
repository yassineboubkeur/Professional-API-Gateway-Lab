server:
  port: 8081

eureka:
  instance:
    hostname: localhost

spring:
  application:
    name: user-service
  cloud:
    eureka:
      client:
        service-url:
          defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
      instance:
        prefer-ip-address: true
        hostname: localhost

app:
  jwt:
    # MUST be identical to the one in api-gateway (HS256 shared secret)
    secret: ${JWT_SECRET:mySecretKeyForTheProfessionalApiGatewayLab2026}
    expiration: 1h
    issuer: professional-api-gateway

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
